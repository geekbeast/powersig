name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        backend: [jax, torch]

    name: test (${{ matrix.backend }}, py${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The torch job installs the JAX CPU wheel too: the torch backend's tests
      # cross-check their results against the JAX reference implementation.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.backend }}" = "torch" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install ".[jax-cpu,dev]"
          else
            pip install ".[jax-cpu,dev]"
          fi

      - name: Run JAX tests
        if: matrix.backend == 'jax'
        env:
          JAX_PLATFORMS: cpu
          NVIDIA_TF32_OVERRIDE: "0"
        run: pytest tests/test_core_jax.py tests/test_diagonal_masking.py tests/test_precision.py -v

      - name: Run PyTorch tests
        if: matrix.backend == 'torch'
        env:
          JAX_PLATFORMS: cpu
          NVIDIA_TF32_OVERRIDE: "0"
        run: |
          pytest tests/test_core_torch.py \
                 tests/test_autodiff_torch.py \
                 tests/test_prefix_family_torch.py \
                 tests/test_precision.py -v
